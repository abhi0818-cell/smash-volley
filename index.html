function authErr(e){
  var s=((e&&e.code)||'')+' '+((e&&e.message)||'');s=s.toLowerCase();
  if(s.indexOf('invalid login')>-1||s.indexOf('invalid_credentials')>-1)return 'Email or password is incorrect.';
  if(s.indexOf('not confirmed')>-1||s.indexOf('email_not_confirmed')>-1)return 'Confirm your email first, using the link we sent you.';
  if(s.indexOf('already')>-1)return 'That email already has an account. Sign in instead.';
  if(s.indexOf('rate')>-1||s.indexOf('too many')>-1)return 'Too many attempts. Wait a few minutes and try again.';
  if(s.indexOf('same')>-1&&s.indexOf('password')>-1)return 'Choose a password different from your old one.';
  if(s.indexOf('weak')>-1||s.indexOf('password')>-1)return 'Choose a stronger password (8+ characters).';
  return 'Could not complete that. Please try again.';
}
async function doAuth(){
  var m=S.authMode,f=S.form,em=(f.email||'').trim(),back=location.origin+location.pathname;S.authMsg='';S.authOk=false;
  if(m==='forgot'&&em&&em.indexOf('@')<0)S.authMsg='Club staff logins cannot be reset here. Ask the club admin to set a new password.';
  else if(m==='signin'&&em&&em.indexOf('@')<0&&/^[a-z0-9._-]{3,30}$/i.test(em))em=em.toLowerCase()+'@'+STAFF_DOMAIN;
  if(S.authMsg){}
  else if(m!=='reset'&&!/^\S+@\S+\.\S+$/.test(em))S.authMsg='Enter a valid email address.';
  else if(m==='signin'&&!f.password)S.authMsg='Enter your password.';
  else if(m==='signup'&&!f.name.trim())S.authMsg='Enter your name.';
  else if((m==='signup'||m==='reset')&&(f.password||'').length<8)S.authMsg='Use at least 8 characters for your password.';
  else if(m==='reset'&&f.password!==f.password2)S.authMsg='The two passwords do not match.';
  if(S.authMsg)return renderPanel();
  S.authBusy=true;renderPanel();var r;
  try{
    if(m==='signin')r=await sb.auth.signInWithPassword({email:em,password:f.password});
    else if(m==='signup')r=await sb.auth.signUp({email:em,password:f.password,options:{data:{full_name:f.name.trim()},emailRedirectTo:back}});
    else if(m==='forgot')r=await sb.auth.resetPasswordForEmail(em,{redirectTo:back});
    else if(m==='reset')r=await sb.auth.updateUser({password:f.password});
    else r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:back}});
  }catch(e){r={error:e}}
  S.authBusy=false;
  if(r.error){S.authMsg=authErr(r.error)}
  else if(m==='signin'){f.password='';S.showAuth=false}
  else if(m==='signup'){
    if(r.data&&r.data.session){f.password='';S.showAuth=false}
    else if(r.data&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)S.authMsg='That email already has an account. Sign in instead.';
    else{S.authOk=true;S.authMsg='Account created. Check your email to confirm it, then sign in. The email can take a few minutes; check spam.';f.password=''}
  }
  else if(m==='forgot'){S.authOk=true;S.authMsg='If that email has an account, a reset link is on its way. Check your inbox and spam.'}
  else if(m==='reset'){f.password='';f.password2='';S.authMode='signin';S.showAuth=false;await loadProfile();renderHead()}
  else{S.authOk=true;S.authMsg='Check your email for the sign-in link, then return to this page.'}
  renderPanel();

document.addEventListener('submit',function(e){var fm=e.target;if(fm.dataset&&fm.dataset.form==='pin'){e.preventDefault();doUnlock();return}if(fm.dataset&&fm.dataset.form==='auth'){e.preventDefault();doAuth()}});
document.addEventListener('keydown',function(){S.lastAct=Date.now()});
document.addEventListener('input',function(e){if(e.target.dataset&&e.target.dataset.srcnew){S.srcNew=S.srcNew||{name:'',kind:'external'};S.srcNew[e.target.dataset.srcnew]=e.target.value;return}if(e.target.dataset&&e.target.dataset.src&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'){var q0=e.target.dataset.src.split('.');S.srcEdit=S.srcEdit||{};S.srcEdit[q0[0]]=S.srcEdit[q0[0]]||{};S.srcEdit[q0[0]][q0[1]]=e.target.value;return}if(e.target.dataset&&e.target.dataset.crep){S.crep=S.crep||{};S.crep[e.target.dataset.crep]=e.target.value;return}if(e.target.dataset&&e.target.dataset.rep){S.rep=S.rep||{};S.rep[e.target.dataset.rep]=e.target.value;return}if(e.target.dataset&&e.target.dataset.sf){S.sf[e.target.dataset.sf]=e.target.value;return}if(e.target.id==='fd-q'){S.frontQ=e.target.value;renderFrontList();return}if(e.target.id==='fd-note'){S.frontDraft.note=e.target.value;return}if(e.target.dataset&&e.target.dataset.f==='useCredit')return;var pp=e.target.dataset&&e.target.dataset.ppl;if(pp){var q=pp.split('.');S.pplIn=S.pplIn||{};S.pplIn[q[0]]=S.pplIn[q[0]]||{};S.pplIn[q[0]][q[1]]=e.target.value}setCfg(e.target);if(e.target.type==='color'&&S.cfg&&S.cfg.s)applyTheme(S.cfg.s.appearance);var f=e.target.dataset&&e.target.dataset.f;if(f)S.form[f]=e.target.value;if(f==='crs')renderPanel()});
document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.sgsel){S.sgroup=e.target.value;S.cfgMsg={};renderSettings();return}if(e.target.dataset&&e.target.dataset.srcnew){S.srcNew=S.srcNew||{name:'',kind:'external'};S.srcNew[e.target.dataset.srcnew]=e.target.value;if(e.target.dataset.srcnew==='kind')renderSettings();return}if(e.target.dataset&&e.target.dataset.src){var q1=e.target.dataset.src.split('.');S.srcEdit=S.srcEdit||{};S.srcEdit[q1[0]]=S.srcEdit[q1[0]]||{};S.srcEdit[q1[0]][q1[1]]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(q1[1]==='kind')renderSettings();return}if(e.target.dataset&&e.target.dataset.cicol){if(S.ci)S.ci.col=e.target.checked;if(S.view==='front')renderFrontList();else renderPanel();return}if(e.target.dataset&&e.target.dataset.rep){S.rep=S.rep||{};S.rep[e.target.dataset.rep]=e.target.value;return}if(e.target.dataset&&e.target.dataset.sim){S.simPaid=e.target.checked;renderMine();return}if(e.target.dataset&&e.target.dataset.shared){doShared(e.target.dataset.shared,e.target.checked);return}if(e.target.dataset&&e.target.dataset.sfc){S.sf[e.target.dataset.sfc]=e.target.checked;return}if(e.target.dataset&&e.target.dataset.viewas){S.viewAs=e.target.value==='admin'?null:e.target.value;try{sessionStorage.setItem('sv_viewas',S.viewAs||'')}catch(x){}applyRole();S.mSel=null;route();return}if(e.target.dataset&&e.target.dataset.role){doSetRole(e.target.dataset.role,e.target.value);return}if(e.target.id==='fd-idc'){S.frontDraft.idc=e.target.checked;return}setCfg(e.target);if(e.target.dataset&&(/^s\.booked_/.test(e.target.dataset.k||'')||/^(a\.|s\.show_court_view)/.test(e.target.dataset.k||''))){if(S.cfg&&S.cfg.s)applyTheme(S.cfg.s.appearance);renderSettings()}var f=e.target.dataset&&e.target.dataset.f;if(f==='useCredit'){S.useCredit=e.target.checked;renderPanel();return}if(f==='stype'){S.form.stype=e.target.value;S.err='';renderPanel()}});
async function route(){
  var v=(location.hash||'#book').slice(1);if(['book','mine','staff','front','settings','reports','plans','profile','people'].indexOf(v)<0)v='book';
  if(v==='reports'||v==='plans'){S.sgroup=v;v='settings'}
  if((v==='mine'||v==='profile')&&!S.user)v='book';if((v==='staff'||v==='front')&&!S.isStaff)v='book';if((v==='settings'||v==='reports'||v==='plans'||v==='people')&&!S.isAdmin)v='book';
  if((location.hash||'#book')!=='#'+v){try{history.replaceState(null,'','#'+v)}catch(e){}}
  if(v!=='settings'&&S.settings)applyTheme(S.settings.appearance);
  S.view=v;S.sel=null;S.mSel=null;S.err='';S.confirmCancel=false;S.dur=1;
  if(v==='mine')await loadMine();
  if(v==='profile'){S.ledger=null;S.pmsg='';renderAll();await loadLedger()}
  if(v==='people'){S.people=null;S.pplMsg={};S.custSel=null;S.cdet=null;renderAll();await loadPeople()}
  if(S.frontTimer){clearInterval(S.frontTimer);S.frontTimer=null}
  if(v==='front'){S.front=null;S.frontOpen=null;S.frontNs=null;S.frontMsg='';renderAll();S.frontTimer=setInterval(function(){if(S.view==='front')loadFront()},30000);await loadFront()}
  if(v==='settings'||v==='reports'||v==='plans'){S.setOpen={};S.cfg=null;try{await loadCfg()}catch(e){S.cfg=null}try{await loadPromos()}catch(e){S.promos=[]}}
  renderAll();if(S.ready&&v!=='mine'&&v!=='profile'&&v!=='people'&&v!=='front')await refresh();
}
window.addEventListener('hashchange',route);
async function init(soft){
  try{
    if(!soft||!S.settings)await loadStatic();
    await loadProfile();S.ready=true;S.loadErr='';
  }catch(e){S.loadErr='The booking service is not reachable right now. Please try again shortly.';S.ready=false}
  await route();
}
sb.auth.onAuthStateChange(function(ev,session){
  setTimeout(function(){
    if(ev==='PASSWORD_RECOVERY'){S.authMode='reset';S.showAuth=true;S.authMsg='';S.form.password='';S.form.password2='';renderHead();renderPanel();return}
    if(ev!=='SIGNED_IN'&&ev!=='SIGNED_OUT')return;
    var uid=session&&session.user?session.user.id:null,cur=S.user?S.user.id:null;
    if(ev==='SIGNED_IN'&&uid===cur)return;
    loadProfile().then(function(){S.authMsg='';S.showAuth=false;renderHead();route()});
  },0);
});
setInterval(tickClock,1000);
setInterval(function(){if(S.desk&&Date.now()-S.lastAct>5*60000){var tk=tok();S.desk=null;sb.rpc('lock_desk',{p_token:tk});renderAll()}},15000);
setInterval(function(){if(S.pending&&S.view==='book'&&!S.busyBtn)renderPanel()},5000);

renderAll();init();
})();
